<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

Asda Barcode Generator</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#000;
}

body::before{
    content:"";
    position:fixed;
    inset:-50%;
    background:
    radial-gradient(circle,#00ff88 0%,transparent 25%),
    radial-gradient(circle,#00aa44 0%,transparent 20%),
    radial-gradient(circle,#00ff44 0%,transparent 15%);
    filter:blur(120px);
    animation:nebula 18s linear infinite;
}

@keyframes nebula{
    0%{
        transform:translate(-10%,-10%) rotate(0deg);
    }
    50%{
        transform:translate(10%,10%) rotate(180deg);
    }
    100%{
        transform:translate(-10%,-10%) rotate(360deg);
    }
}

.card{
    position:relative;
    z-index:1;

    width:90%;
    max-width:700px;

    background:rgba(0,0,0,0.8);

    border:1px solid #00ff88;

    border-radius:20px;

    padding:25px;

    box-shadow:
    0 0 20px rgba(0,255,136,.4);
}

h1{
    color:#00ff88;
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:12px;

    border:none;
    border-radius:10px;

    background:#111;
    color:white;

    border:1px solid #00ff88;
}

input:focus{
    outline:none;
    box-shadow:0 0 10px #00ff88;
}

button{
    width:100%;
    padding:14px;

    border:none;
    border-radius:10px;

    cursor:pointer;

    background:#00ff88;
    color:black;

    font-weight:bold;
    font-size:16px;
}

button:hover{
    opacity:.9;
}

#barcodeArea{
    margin-top:25px;
    text-align:center;
    display:none;
}

#productTitle{
    color:white;
    margin-bottom:10px;
}

svg{
    background:white;
    padding:10px;
    border-radius:10px;
}

#numberOutput{
    margin-top:10px;
    color:#ccc;
    word-break:break-all;
    font-size:12px;
}

</style>
</head>
<body>

<div class="card">

<h1>Asda Barcode Generator</h1>

<input
id="product"
placeholder="Product Name">

<input
id="ean"
placeholder="EAN-13">

<input
id="price"
placeholder="Price (0.15, 1.00, etc.)">

<button onclick="generate()">
Generate Barcode
</button>

<div id="barcodeArea">

<h2 id="productTitle"></h2>

<svg id="barcode"></svg>

<div id="numberOutput"></div>

</div>

</div>

<script>

function luhn(number){

    let sum = 0;
    let alt = true;

    for(let i = number.length - 1; i >= 0; i--){

        let n = parseInt(number[i]);

        if(alt){
            n *= 2;

            if(n > 9){
                n -= 9;
            }
        }

        sum += n;

        alt = !alt;
    }

    return (10 - (sum % 10)) % 10;
}

function generate(){

    const product =
        document.getElementById("product")
        .value
        .trim();

    const ean =
        document.getElementById("ean")
        .value
        .trim();

    const priceText =
        document.getElementById("price")
        .value
        .trim();

    if(!/^\\d{13}$/.test(ean)){
        alert("EAN must be 13 digits");
        return;
    }

    const price =
        parseFloat(priceText);

    if(isNaN(price)){
        alert("Enter a valid price");
        return;
    }

    const pence =
        Math.round(price * 100);

    const priceField =
        String(pence).padStart(5,"0");

    const payload =
        "330" +
        ean +
        priceField +
        "2056";

    const check =
        luhn(payload);

    const fullCode =
        payload +
        check;

    document
        .getElementById("productTitle")
        .innerText = product;

    document
        .getElementById("numberOutput")
        .innerText = fullCode;

    JsBarcode(
        "#barcode",
        fullCode,
        {
            format:"CODE128",
            width:2,
            height:120,
            displayValue:false,
            margin:10
        }
    );

    document
        .getElementById("barcodeArea")
        .style.display = "block";
}

</script>

</body>
  </html>
